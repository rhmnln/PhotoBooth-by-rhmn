<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mode Solo — PhotoBox</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/solo.css" />
</head>
<body>
  <main class="kiosk kiosk--wide">
    <div class="kiosk__bezel">
      <a href="index.html" class="btn-ghost" style="padding:0;">← Kembali</a>
      <span class="kiosk__brand">Mode Solo</span>
    </div>

    <!-- SCREEN 1: pilih template -->
    <section id="screenTemplate" class="screen">
      <h2 class="screen__title">Pilih gaya strip</h2>
      <p class="screen__subtitle">4 foto berturut-turut, langsung jadi satu strip.</p>

<div class="field">
  <label for="soloNameInput">Nama kamu (buat caption di strip)</label>
  <input id="soloNameInput" type="text" placeholder="cth. Sari" maxlength="20" autocomplete="off" />
</div>

<div id="templateGrid" class="template-grid"></div>
      <button id="toCaptureBtn" class="btn btn-primary" style="margin-top:24px;">Lanjut ke Kamera</button>
    </section>

    <!-- SCREEN 2: kamera & countdown -->
    <section id="screenCapture" class="screen is-hidden">
      <h2 class="screen__title">Siap-siap!</h2>
      <div class="camera-frame">
        <video id="videoEl" playsinline muted></video>
        <div id="countdownOverlay" class="countdown is-hidden"></div>
        <div id="flashOverlay" class="flash-overlay"></div>
      </div>
      <div id="progressDots" class="progress-dots"></div>
      <p id="captureStatus" class="status-text">Kamera akan diminta izin akses.</p>
      <button id="startCaptureBtn" class="btn btn-primary">Mulai Ambil 4 Foto</button>
    </section>

    <!-- SCREEN 3: hasil -->
    <section id="screenResult" class="screen is-hidden">
      <h2 class="screen__title">Strip kamu jadi! 🎉</h2>
      <div id="resultWrap" class="result-wrap">
        <div class="spinner"></div>
      </div>
      <div class="result-actions">
        <button id="downloadBtn" class="btn btn-primary">Unduh ke Perangkat</button>
        <button id="printBtn" class="btn btn-secondary">Cetak Langsung</button>
        <button id="retryBtn" class="btn btn-ghost">Ulangi dari awal</button>
      </div>
    </section>
  </main>

  <div id="printArea" class="print-area"></div>

  <script src="js/templates.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/compose.js"></script>
  <script type="module" src="js/solo.js"></script>
</body>
</html>
